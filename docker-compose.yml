services:
  db:
    image: postgres:15-alpine
    container_name: finsight-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finsight_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finsight-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/finsight_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=finsight_super_secret_jwt_key_2025
      - REFRESH_SECRET=finsight_refresh_token_very_long_and_secure_key
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production
    depends_on:
      - db
      - redis

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: finsight-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PORT=8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server
      - ai

volumes:
  pgdata:

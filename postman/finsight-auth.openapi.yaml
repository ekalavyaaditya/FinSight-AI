openapi: 3.0.3
info:
  title: FinSight AI - Auth API
  description: |
    Auth endpoints for FinSight AI.

    **Import in Postman:** File → Import → select this file.

    After login, copy `accessToken` and `refreshToken` from the response into the
    collection variables (or use Postman's Tests tab to auto-save them).

    OTP and password-reset tokens are printed in server logs during local development:
    - `[SANDBOX OTP] Verification code for ...`
    - `[SANDBOX PASSWORD RESET] URL: ...`
  version: 1.0.0

servers:
  - url: http://localhost:5001
    description: Local dev server (default)
  - url: http://localhost:5000
    description: Docker compose server

tags:
  - name: Public Auth
  - name: Protected Profile

paths:
  /api/auth/register:
    post:
      tags: [Public Auth]
      summary: Register a new user
      description: Creates an account and sends a 6-digit OTP (logged to server console in sandbox).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: Password1
              fullName: John Doe
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/verify-otp:
    post:
      tags: [Public Auth]
      summary: Verify email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              email: user@example.com
              otp: '123456'
      responses:
        '200':
          description: Account verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /api/auth/resend-otp:
    post:
      tags: [Public Auth]
      summary: Resend verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: OTP resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /api/auth/login:
    post:
      tags: [Public Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: Password1
              rememberMe: true
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          $ref: '#/components/responses/ErrorMessage'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    example: EMAIL_UNVERIFIED
                  email:
                    type: string
                    format: email

  /api/auth/oauth/google:
    post:
      tags: [Public Auth]
      summary: Google OAuth (mock)
      description: Mock Google sign-in for local development. Auto-registers unverified users as verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
            example:
              email: google.user@gmail.com
              name: Google User
              googleId: '123456789'
      responses:
        '200':
          description: Google login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'

  /api/auth/refresh:
    post:
      tags: [Public Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: '{{refreshToken}}'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/ErrorMessage'

  /api/auth/logout:
    post:
      tags: [Public Auth]
      summary: Logout (invalidate refresh token session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: '{{refreshToken}}'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/forgot-password:
    post:
      tags: [Public Auth]
      summary: Request password reset
      description: Reset token is logged to the server console in sandbox mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: Reset request accepted (same response whether email exists or not)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/reset-password:
    post:
      tags: [Public Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              newPassword: NewPassword1
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'

  /api/auth/profile:
    get:
      tags: [Protected Profile]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Protected Profile]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              fullName: Jane Doe
              currency: INR
              riskProfile: MODERATE
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserProfile'

  /api/auth/change-password:
    put:
      tags: [Protected Profile]
      summary: Change password (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: Password1
              newPassword: NewPassword1
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/delete-account:
    delete:
      tags: [Protected Profile]
      summary: Permanently delete account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use the accessToken returned from login

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Must include uppercase, lowercase, and a number
        fullName:
          type: string
          minLength: 1

    VerifyOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          minLength: 6
          maxLength: 6

    EmailOnlyRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        rememberMe:
          type: boolean
          default: false

    GoogleOAuthRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        googleId:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        currency:
          type: string
          example: INR
        riskProfile:
          type: string
          example: MODERATE

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        creditScore:
          type: integer
        currency:
          type: string
        riskProfile:
          type: string
        createdAt:
          type: string
          format: date-time

    AuthSuccessResponse:
      type: object
      properties:
        message:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string

    ErrorMessage:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                example: TOKEN_EXPIRED

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
